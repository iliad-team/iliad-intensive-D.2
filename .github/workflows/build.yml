name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Force-pushes the generated tree to the `build` branch.
permissions:
  contents: write

concurrency:
  group: build-branch
  cancel-in-progress: false

# One job builds everything and publishes it to the orphan `build` branch:
#   slides/<deck>-present.pdf, slides/<deck>-handout.pdf   (both decks)
#   part6_goalmisgen/*.ipynb + solutions.py + support modules   (Colab opens these)
# PRs build but do not publish. Nothing generated is ever committed to main.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- notebook: gen/masters/master_2_6.py -> build/exercises/part6_goalmisgen/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate the goal-misgeneralisation notebook
        run: |
          pip install -r gen/requirements-gen.txt
          python gen/core/main.py --chapters='2.*' --use_py=true

      # ---- slides: present (\pause reveals on) + handout (collapsed) for each deck,
      # via a one-line wrapper that \def-s \HANDOUT before \input-ing the deck.
      - name: Prepare wrapped slide sources
        run: |
          set -euo pipefail
          for deck in vpg-slides goalmisgen-slides; do
            printf '\\input{%s}\n'                "$deck" > "$deck-present.tex"
            printf '\\def\\HANDOUT{}\\input{%s}\n' "$deck" > "$deck-handout.tex"
          done
      - name: Build slides
        uses: xu-cheng/latex-action@v3
        with:
          # root_file only triggers the TeX Live image pull; post_compile builds
          # every target (this one included) in the same container.
          root_file: vpg-slides-present.tex
          compiler: pdflatex
          args: -interaction=nonstopmode -halt-on-error -file-line-error
          post_compile: |
            set -uo pipefail
            compile() {
              pdflatex -interaction=nonstopmode -halt-on-error -file-line-error "$1.tex" || return 1
              if grep -qF '\citation' "$1.aux" 2>/dev/null; then bibtex "$1" || return 1; fi
              pdflatex -interaction=nonstopmode -halt-on-error -file-line-error "$1.tex" || return 1
              pdflatex -interaction=nonstopmode -halt-on-error -file-line-error "$1.tex" || return 1
            }
            fail=0
            for base in vpg-slides-present vpg-slides-handout goalmisgen-slides-present goalmisgen-slides-handout; do
              echo "::group::build $base"
              compile "$base" || { echo "::error::build failed: $base"; fail=1; }
              echo "::endgroup::"
            done
            exit $fail

      # ---- assemble the tree that becomes the `build` branch
      - name: Assemble publish tree
        run: |
          set -euo pipefail
          mkdir -p publish/slides publish/part6_goalmisgen
          cp vpg-slides-present.pdf vpg-slides-handout.pdf goalmisgen-slides-present.pdf goalmisgen-slides-handout.pdf publish/slides/
          cp -r gen/support/part6_goalmisgen/. publish/part6_goalmisgen/
          cp build/exercises/part6_goalmisgen/*.ipynb build/exercises/part6_goalmisgen/solutions.py publish/part6_goalmisgen/
          for nb in publish/part6_goalmisgen/*.ipynb; do
            python -c "import json; json.load(open('$nb'))"
            if grep -q "callummcdougall/ARENA_3.0" "$nb"; then echo "::error::ARENA clone URL leaked into $nb"; exit 1; fi
          done
          find publish -type f | sort

      - name: Push to the `build` branch (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: build
          force_orphan: true
          commit_message: "build @ ${{ github.sha }}"
