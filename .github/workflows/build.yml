name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Force-pushes the generated tree to the `build` branch.
permissions:
  contents: write

concurrency:
  group: build-branch
  cancel-in-progress: false

# Generates the goal-misgeneralisation Colab notebook from gen/masters/master_2_6.py
# and publishes it, with its support modules, to the orphan `build` branch as
# part6_goalmisgen/. Colab opens it from there. PRs build but do not publish;
# nothing generated is ever committed to main. The slide decks live in the
# website repo (iliad-team/iliad-intensive, tex/policy-gradients-misgeneralization/).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate the notebook
        run: |
          pip install -r gen/requirements-gen.txt
          python gen/core/main.py --chapters='2.*' --use_py=true

      - name: Assemble publish tree
        run: |
          set -euo pipefail
          mkdir -p publish/part6_goalmisgen
          cp -r gen/support/part6_goalmisgen/. publish/part6_goalmisgen/
          cp build/exercises/part6_goalmisgen/*.ipynb build/exercises/part6_goalmisgen/solutions.py publish/part6_goalmisgen/
          for nb in publish/part6_goalmisgen/*.ipynb; do
            python -c "import json; json.load(open('$nb'))"
            if grep -q "callummcdougall/ARENA_3.0" "$nb"; then echo "::error::ARENA clone URL leaked into $nb"; exit 1; fi
          done
          find publish -type f | sort

      - name: Push to the `build` branch (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: build
          force_orphan: true
          commit_message: "build @ ${{ github.sha }}"
